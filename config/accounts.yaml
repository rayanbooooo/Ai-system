    tradovate_account_id: ""          # REPLACE - your Tradovate account id for this Apex account
    tradovate_env: demo               # demo | live - confirm which one this account routes through
    rules_ref: "eval_50k"             # REPLACE - must match a key in config/rules.yaml
    start_date: "2026-08-20"          # REPLACE
    instruments: ["MNQ", "MGC"]
